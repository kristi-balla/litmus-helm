{{ if not (has "pod-config-update" .Values.experiments.disabled) }}
---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Updates the config of pods belonging to a deployment
kind: ChaosExperiment
metadata:
  name: pod-config-update
  labels:
    {{- include "kubernetes-chaos.labels" . | indent 4 }}
spec:
  definition:
    scope: Namespaced
    image: "{{ .Values.image.litmusGO.repository }}:{{ .Values.image.litmusGO.tag }}"
    imagePullPolicy: {{ .Values.image.litmusGO.pullPolicy }}
    args:
      - -c
      - ./experiments -name pod-config-update
    command:
    - /bin/bash
    labels:
      name: pod-config-update
      app.kubernetes.io/part-of: litmus
{{ end }}
