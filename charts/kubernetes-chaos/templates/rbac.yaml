{{- if eq .Values.mode "namespace" }}
{{- range .Values.ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubernetes-chaos.name" $ }}-chaos-admin
  namespace: {{ . }}
  labels:
    {{- include "kubernetes-chaos.labels" $ | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubernetes-chaos.name" $ }}-chaos-admin
  namespace: {{ . }}
  labels:
    {{- include "kubernetes-chaos.labels" $ | indent 4 }}
rules:
- apiGroups:
  - ""
  - "apps"
  - "batch"
  - "extensions"
  - "apps.openshift.io"
  - "argoproj.io"
  - "litmuschaos.io"
  resources:
  - "jobs"
  - "pods"
  - "pods/exec"
  - "pods/log"
  - "pods/eviction"
  - "daemonsets"
  - "replicasets"
  - "deployments"
  - "statefulsets"
  - "services"
  - "events"
  - "configmaps"
  - "secrets"
  - "networkpolicies"
  - "replicationcontrollers"
  - "deploymentconfigs"
  - "rollouts"
  - "chaosengines"
  - "chaosexperiments"
  - "chaosresults"
  verbs:
  - "create"
  - "delete"
  - "get"
  - "list"
  - "patch"
  - "update"
  - "deletecollection"
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubernetes-chaos.name" $ }}-chaos-admin
  namespace: {{ . }}
  labels:
    {{- include "kubernetes-chaos.labels" $ | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubernetes-chaos.name" $ }}-chaos-admin
subjects:
- kind: ServiceAccount
  name: {{ include "kubernetes-chaos.name" $ }}-chaos-admin
  namespace: {{ . }}
{{- end }}
{{- end }}
