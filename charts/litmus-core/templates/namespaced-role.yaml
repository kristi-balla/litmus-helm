{{ if eq .Values.operatorMode "namespaced" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "litmus.fullname" . }}
  labels:
    app: {{ template "litmus.name" . }}
    {{- include "litmus.labels" . | indent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]

- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]

# ConfigMaps and Secrets - read access for experiment configuration
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

# Events - for experiment visibility
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "get", "list", "watch"]

- apiGroups: ["apps"]
  resources: ["deployments","daemonsets","statefulsets","replicasets"]
  verbs: ["get","create","update","patch","delete","list","watch","deletecollection"]

- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get","create","update","patch","delete","list","watch","deletecollection"]

- apiGroups: ["litmuschaos.io"]
  resources: ["chaosengines","chaosexperiments","chaosresults"]
  verbs: ["get","create","update","patch","delete","list","watch","deletecollection"]

- apiGroups: ["litmuschaos.io"]
  resources: ["chaosengines/finalizers"]
  verbs: ["update"]

- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get","create","list","update","delete"]

{{ end }}
