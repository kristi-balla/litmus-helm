{{- if and .Values.serviceAccount.create ( eq .Values.global.INFRA_MODE "namespace") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workflow-controller.serviceAccountName" . }}
  labels:
    {{- include "workflow-controller.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]
  
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "get" ]
  
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "delete"]
{{- end }}
